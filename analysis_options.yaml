include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - .toolchain/**
    - build/**
    - android/**
    - ios/**
    - lib/**/*.g.dart
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - avoid_print
    - prefer_single_quotes
    - prefer_final_locals
    - unawaited_futures
    - cancel_subscriptions
    - always_declare_return_types
