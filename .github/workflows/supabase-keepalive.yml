# Keeps a Free-plan Supabase project from being paused for inactivity
# (Supabase pauses Free projects with too little database activity in 7 days,
# which takes BVM offline until someone presses "Resume" in the dashboard).
#
# Setup (once): GitHub repo > Settings > Secrets and variables > Actions >
# New repository secret:
#   SUPABASE_URL              same value as in .env
#   SUPABASE_PUBLISHABLE_KEY  same value as in .env (ships in the app anyway)
# Without the secrets the job does nothing.
#
# The call is the anonymous "are messages waiting?" check with a random user
# id and token: it runs a real database query and always answers 0.
name: Supabase keep-alive

on:
  schedule:
    - cron: "23 6 */2 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Query the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "Secrets not set; nothing to do."
            exit 0
          fi
          token=$(head -c 24 /dev/urandom | base64 | tr -d '/+=' | head -c 32)
          curl --fail-with-body --silent --show-error --max-time 30 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/inbox_pending" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"p_user\":\"$(cat /proc/sys/kernel/random/uuid)\",\"p_token\":\"keepalive-$token\"}"
          echo
